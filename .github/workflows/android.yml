name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Gradle assemble target
        required: true
        default: debug
        type: choice
        options: [debug, release]

jobs:
  # The engine is plain Kotlin with no Android imports, so its tests run on a
  # bare JVM in well under a minute.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run engine unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/

  apk:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK; this just makes the choice explicit.
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Build the APK
        run: ./gradlew --no-daemon assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}
      - uses: actions/upload-artifact@v4
        with:
          name: barnyard-blitz-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
