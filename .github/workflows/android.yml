name: Android APK

# Kicked off by hand - a cold build downloads the Android SDK and NDK and
# compiles CPython, which takes the better part of an hour.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Buildozer target
        required: true
        default: debug
        type: choice
        options: [debug, release]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            cmake ccache unzip zip

      # The SDK, NDK and compiled recipes all land here; without the cache
      # every run re-downloads several gigabytes.
      - name: Cache buildozer state
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          # Cython is pinned because python-for-android's CPython recipe does
          # not build against Cython 3.x.
          pip install "cython==0.29.36" buildozer

      - name: Regenerate launcher assets
        run: |
          pip install pygame
          python tools/make_assets.py

      - name: Build the APK
        run: buildozer -v android ${{ inputs.build_type }}

      - uses: actions/upload-artifact@v4
        with:
          name: barnyard-blitz-${{ inputs.build_type }}-apk
          path: bin/*.apk
          if-no-files-found: error
